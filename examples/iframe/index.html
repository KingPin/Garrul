<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Garrul — iframe example</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
		h1 { margin-top: 0; }
		hr { border: none; border-top: 1px solid #e5e7eb; margin: 2rem 0; }
		#garrul-iframe {
			width: 100%;
			border: 0;
			display: block;
			/* The initial height covers the skeleton; the inline script
			   below replaces it with the real content height. */
			min-height: 400px;
		}
	</style>
</head>
<body>
	<h1>Iframe embed demo</h1>
	<p>This example mounts Garrul via <code>&lt;iframe&gt;</code> instead of
	the script-tag widget. Same comments, same UI — the iframe just hosts
	the widget for sites that can't add inline JS (strict CSP, sandboxed
	CMSes, etc).</p>

	<hr>

	<!--
		The iframe needs the parent origin to safely postMessage height
		updates (we don't broadcast to "*"). Easiest way: build the src
		on the client and pass `parent_origin` as a query param.

		This origin must be in the Worker's ALLOWED_ORIGINS: an origin
		the operator hasn't allowlisted gets no postMessage, and the
		page's CSP frame-ancestors won't let it frame /embed/* at all.
	-->
	<iframe
		id="garrul-iframe"
		title="Comments"
		loading="lazy"
		referrerpolicy="no-referrer"></iframe>

	<script>
		(function () {
			var f = document.getElementById("garrul-iframe");
			var src = new URL("http://localhost:8787/embed/");
			src.searchParams.set("slug", "welcome");
			src.searchParams.set("title", "Iframe demo");
			src.searchParams.set("url", window.location.href);
			src.searchParams.set("published", "2026-09-11T12:00:00Z");
			src.searchParams.set("parent_origin", window.location.origin);
			// A comment permalink (#garrul-comment-<id>) on this page is
			// forwarded into the frame as its fragment, on load and on later
			// hash changes. A fragment-only change does not reload the frame.
			var PREFIX = "#garrul-comment-";
			if (location.hash.indexOf(PREFIX) === 0) src.hash = location.hash;
			f.src = src.toString();
			window.addEventListener("hashchange", function () {
				if (location.hash.indexOf(PREFIX) !== 0) return;
				var next = new URL(f.src);
				next.hash = location.hash;
				f.src = next.toString();
			});

			// Auto-resize the iframe to match the inner widget's content height.
			// The iframe posts `{type:"garrul:height", height}` whenever its
			// content resizes; we mirror that onto the iframe element.
			var apiOrigin = new URL(f.src).origin;
			window.addEventListener("message", function (e) {
				if (e.origin !== apiOrigin || e.source !== f.contentWindow) return;
				var data = e.data;
				if (!data) return;
				if (data.type === "garrul:scroll" && Number.isFinite(data.top)) {
					// Permalink target: bring it into the host page's viewport.
					var y = f.getBoundingClientRect().top + window.scrollY + data.top;
					window.scrollTo(0, Math.max(0, y - window.innerHeight / 3));
					return;
				}
				if (data.type !== "garrul:height") return;
				if (!Number.isFinite(data.height)) return;
				f.style.height = data.height + "px";
			});
		})();
	</script>
</body>
</html>
