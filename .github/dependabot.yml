# Dependency updates.
#
# The github-actions ecosystem is the load-bearing half: every `uses:` line in
# .github/workflows/ is pinned to a full commit SHA rather than a mutable tag
# (see the note in ci.yml), and a pin with nothing watching it is a pin that
# rots. Dependabot rewrites the SHA *and* the trailing `# vX.Y.Z` comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Action bumps don't change agent-facing behavior, and
    # .github/workflows/agents-docs-sync.yml fails any PR touching watched
    # source paths without an AGENTS.md update. Label them so that gate waives
    # itself instead of blocking a security update.
    labels:
      - dependencies
      - agents-docs-ok

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - agents-docs-ok
    ignore:
      # @types/node tracks the *runtime* major, not the newest release. Types a
      # major ahead of `engines: >=24` make tsc accept Node 26 APIs that Node 24
      # doesn't ship — a green build that fails at runtime. Already reverted
      # once (e9d9355). Raise this by hand together with engines and .nvmrc.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      # One PR for the routine noise; majors still arrive individually so a
      # breaking bump gets read on its own.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
