name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI only reads the repo (checkout + npm + dry-run build). Pin the default
# GITHUB_TOKEN to read-only so a compromised dependency can't push, tag, or
# open PRs with it.
permissions:
  contents: read

# Cancel any in-flight CI run for the same ref when a new push lands.
# Saves minutes on rapid pushes and avoids the "second push lands first"
# race that shows a stale red check on the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not tags — a tag is mutable and can be repointed
      # by whoever controls the action repo (CVE-2025-30066). Dependabot keeps
      # these fresh; update the trailing version comment with the SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the bundle-delta step can build the PR's base
          # commit in a worktree. Shallow clones have no origin/<base> ref.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # wrangler.toml is gitignored; wrangler 4's framework auto-detect
      # errors without one. The example file's placeholder IDs are fine
      # for --dry-run (no API calls). Keeps CI symmetric with release.yml.
      - run: cp wrangler.example.toml wrangler.toml
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Gate: nothing under tests/ may carry a real-world identity — an address
      # on a live domain, an avatar URL with an account id in it, a profile URL,
      # an account handle. Fixtures synthesise the shape of a real export; they
      # are never a copy of one. The check encodes that as an invariant rather
      # than a deny-list, so it needs no knowledge of whose identity it is
      # protecting — which is the only form the check can take in a public repo.
      - run: npm run identity:check
      # Gate: the committed release-manifest.json must match what the
      # generator derives from the source tree. Catches drift between
      # Bindings/secrets/migrations and the declared upgrade contract.
      - run: npm run manifest:check
      # Gate: the committed config templates (secrets.example.env,
      # .dev.vars.example, the generated regions of wrangler.example.toml
      # and AGENTS-OPERATE.md) must match scripts/config-registry.ts.
      - run: npm run config:check
      - run: npm run build
      - run: npm run size
      # Informational, never a gate: `npm run size` above is the gate. This
      # builds the PR's base commit in a throwaway worktree and reports the
      # gzip delta to the step summary, so a feature's weight is visible while
      # it can still be weighed rather than at the ceiling. The script exits 0
      # on every failure path; continue-on-error covers the unexpected ones.
      # Reads only $GITHUB_BASE_REF (the base branch, not attacker-controlled)
      # and passes it to git via execFile, never a shell.
      - if: github.event_name == 'pull_request'
        run: npm run size:delta
        continue-on-error: true
