name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Releases are per-tag, but two pushes to the same tag should not run
# in parallel and clobber each other's uploaded assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable and
      # can be repointed by whoever controls the action repo — the
      # tj-actions/changed-files compromise (CVE-2025-30066) was exactly that.
      # Dependabot keeps these fresh (.github/dependabot.yml); update the
      # trailing version comment whenever the SHA moves.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # wrangler.toml is gitignored (it holds real binding IDs). The dry-run
      # build below doesn't talk to the API, but wrangler 4 still requires a
      # config file or it falls back to framework auto-detection and errors.
      # The example file's placeholder IDs are accepted by --dry-run.
      - run: cp wrangler.example.toml wrangler.toml
      # Enforce the same gates CI runs so a release tag can't ship
      # a broken or oversized embed bundle.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Gate: refuse to cut a tagged release if release-manifest.json
      # doesn't match the source tree — operators rely on it for upgrades.
      - run: npm run manifest:check
      - run: npm run build
      - run: npm run size
      # The one third-party action in the one job with contents: write, holding
      # GITHUB_TOKEN and the built artifacts. A repointed tag here could publish
      # an arbitrary release-manifest.json and embed.js that every self-hoster's
      # `npm run upgrade` trusts, so the SHA pin matters most on this line.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          # release-manifest.json is the upgrade contract for self-hosters.
          # The orchestrator primarily fetches it from raw.githubusercontent
          # (no auth), but attaching it to the release gives a fallback URL.
          files: |
            dist/embed.js
            dist/embed.js.map
            release-manifest.json
